# -----------------------------------------
# Nome da aplicacao e porta
# -----------------------------------------
spring.application.name=comandas-api
server.port=8485

# -----------------------------------------
# Banco de dados H2 (em memoria)
# -----------------------------------------
spring.datasource.url=jdbc:h2:mem:comandasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desativa Docker Compose se voce nao usa
spring.docker.compose.enabled=false

# -----------------------------------------
# Formatacao de datas no JSON
# -----------------------------------------
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo

# -----------------------------------------
# Endereco do servico de cozinha (via gateway)
# -----------------------------------------
cozinha.api.url=http://localhost:8081/api/cozinha

# -----------------------------------------
# Logs
# -----------------------------------------
logging.level.org.springframework.web=INFO
logging.level.com.example=DEBUG

# -----------------------------------------
# Habilitar CORS globalmente (se necessario via configuracao)
# -----------------------------------------
# (Configuracao recomendada via WebMvcConfigurer em codigo)
# spring.web.cors.allowed-origins=http://localhost:3000